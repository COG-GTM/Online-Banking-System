<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common-header"/>
<body roleId="page-top" data-spy="scroll" data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar"/>
<div class="container main">
    <div class="row">
        <div class="col-md-6">
            <div th:if="${errorMessage}" id="amountError" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

            <form th:action="@{/account/deposit}" method="post">
                <div class="form-group" >
                    <label for="accountType">1. Please select the account you would like to deposit:</label>
                    <select class="form-control" th:value="${accountType}" name="accountType" id="accountType" required="required" autofocus="autofocus">
                        <option disabled="disabled" selected="selected"> -- select your account -- </option>
                        <option>Primary</option>
                        <option>Savings</option>
                    </select>
                    <br />
                </div>

                <div class="form-group">
                    <label for="amount">2. Please specify the amount you would like to deposit: </label>
                    <p id="amountHint" class="help-block" th:text="#{transaction.amount.hint}">Enter a positive dollar amount with up to two decimal places, for example 25 or 25.50.</p>
                    <span class="input-group-addon">Amount $</span>
                    <input th:value="${amount}" type="text" inputmode="decimal" name="amount" id="amount" class="form-control" required="required" th:attr="aria-invalid=${errorMessage != null ? 'true' : null},aria-describedby=${errorMessage != null ? 'amountHint amountError' : 'amountHint'}"/>
                </div>

                <input type="hidden"
                       name="${_csrf.parameterName}"
                       value="${_csrf.token}"/>

                <button class="btn btn-lg btn-primary btn-block" type="submit">Deposit</button>
            </form>

            <div class="col-md-6">
            </div>
        </div>
    </div>
</div>


<div th:replace="common/header :: body-bottom-scripts"/>

</body>
</html>
