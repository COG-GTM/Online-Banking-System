<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common-header"/>
<body roleId="page-top">
<head th:replace="common/header :: navbar"/>
<div class="container main">
    <div class="row">
        <div class="col-lg-12">
        </div>
        <!-- /.col-lg-12 -->
    </div>
    <!-- /.row -->
    <div class="row">
        <div class="col-lg-6 col-md-6">
            <div class="card mb-4 border-info">
                <div class="card-header bg-info-subtle">
                    <div class="row">
                        <div class="col-6">
                            <!--<i class="fa fa-comments fa-5x"></i>-->
                            <h2>Primary Balance: </h2>
                        </div>
                        <div class="col-6 text-end">
                            <h1><i class="fa fa-usd" aria-hidden="true"></i> <span th:text="${primaryAccount.accountBalance}">...</span></h1>
                        </div>
                    </div>
                </div>
                <a th:href="@{/account/primaryAccount}">
                    <div class="card-footer">
                        <span class="float-start">View Details</span>
                        <span class="float-end"><i class="fa fa-arrow-circle-right"></i></span>
                        <div class="clearfix"></div>
                    </div>
                </a>
            </div>
            
            <div class="card mb-4 border-success">
                <div class="card-header bg-success-subtle">
                    <div class="row">
                        <div class="col-6">
                            <h2>Savings Balance: </h2>
                        </div>
                        <div class="col-6 text-end">
                            <h1><i class="fa fa-usd" aria-hidden="true"></i> <span th:text="${savingsAccount.accountBalance}">...</span></h1>
                        </div>
                    </div>
                </div>
                <a th:href="@{/account/savingsAccount}">
                    <div class="card-footer">
                        <span class="float-start">View Details</span>
                        <span class="float-end"><i class="fa fa-arrow-circle-right"></i></span>
                        <div class="clearfix"></div>
                    </div>
                </a>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="card mb-4 border-warning">
                <div class="card-header bg-warning-subtle">
                    <div class="row">
                        <div class="col-3">
                            <i class="fa fa-credit-card fa-5x"></i>
                        </div>
                        <div class="col-9 text-end">
                            <div>Deposit</div>
                        </div>
                    </div>
                </div>
                <a th:href="@{/account/deposit}">
                    <div class="card-footer">
                        <span class="float-start">Go to Deposit</span>
                        <span class="float-end"><i class="fa fa-arrow-circle-right"></i></span>
                        <div class="clearfix"></div>
                    </div>
                </a>
            </div>
        </div>
        
        
        <div class="col-lg-3 col-md-6">
            <div class="card mb-4 border-danger">
                <div class="card-header bg-danger-subtle">
                    <div class="row">
                        <div class="col-3">
                            <i class="fa fa-money fa-5x"></i>
                        </div>
                        <div class="col-9 text-end">
                            <div>Withdraw</div>
                        </div>
                    </div>
                </div>
                <a th:href="@{/account/withdraw}">
                    <div class="card-footer">
                        <span class="float-start">Go to Withdrawal</span>
                        <span class="float-end"><i class="fa fa-arrow-circle-right"></i></span>
                        <div class="clearfix"></div>
                    </div>
                </a>
            </div>
        </div>
    </div>
    <!-- /.row -->


</div>


<div th:replace="common/header :: body-bottom-scripts"/>

</body>
</html>
