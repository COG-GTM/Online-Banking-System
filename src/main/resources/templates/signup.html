<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common-header" />
<body roleId="page-top">
<!--<head th:replace="common/header :: navbar" />-->

<div class="container">
<fieldset>
    <div class="row main">
        <div class="col-12">
            <div class="text-center">
				<h2 th:text="#{title.signupForm}">signup</h2>
                <hr />
            </div>
        </div>
        <div class="main-login main-center">
            <form method="post" th:action="@{/signup}">

                <div class="mb-3">
                    <label for="firstName" class="cols-sm-2 form-label">First Name</label>
                    <div class="cols-sm-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-user fa" aria-hidden="true"></i></span>
                            <input type="text" class="form-control" th:value="${user.firstName}" id="firstName" name="firstName" roleId="firstname"  placeholder="Enter your first name" required="required"/>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="lastName" class="cols-sm-2 form-label">Last Name</label>
                    <div class="cols-sm-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-user fa" aria-hidden="true"></i></span>
                            <input type="text" class="form-control" th:value="${user.lastName}" id="lastName" name="lastName" roleId="lastName"  placeholder="Enter your last name" required="required"/>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="cols-sm-2 form-label">Phone</label>
                    <div class="cols-sm-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-phone fa" aria-hidden="true"></i></span>
                            <input type="text" class="form-control" th:value="${user.phone}" id="phone" name="phone" roleId="phone"  placeholder="xxx-xxx-xxxx" required="required"/>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="cols-sm-2 form-label">Your Email</label><span class="bg-danger-subtle text-danger-emphasis float-end" th:if="${emailExists}">Email already exists</span>
                    <div class="cols-sm-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-envelope fa" aria-hidden="true"></i></span>
                            <input type="text" class="form-control" th:value="${user.email}" id="email" name="email" roleId="email"  placeholder="Enter your Email" required="required"/>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="username" class="cols-sm-2 form-label">Username</label><span class="bg-danger-subtle text-danger-emphasis float-end" th:if="${usernameExists}">Username already exists</span>
                    <div class="cols-sm-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-users fa" aria-hidden="true"></i></span>
                            <input type="text" class="form-control" th:value="${user.username}" id="username" name="username" roleId="username"  placeholder="Enter your Username" required="required"/>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="cols-sm-2 form-label">Password</label>
                    <div class="cols-sm-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-lock fa-lg" aria-hidden="true"></i></span>
                            <input type="password" class="form-control" th:value="${user.password}" id="password" name="password" roleId="password"  placeholder="Enter your Password" required="required"/>
                        </div>
                        <div class="form-check mt-2">
                            <input id="showPassword" class="form-check-input" type="checkbox" />
                            <label class="form-check-label" for="showPassword">Show Password</label>
                        </div>
                    </div>
                </div>

                <!--<div class="mb-3">-->
                    <!--<label for="confirm" class="cols-sm-2 form-label">Confirm Secret</label>-->
                    <!--<div class="cols-sm-10">-->
                        <!--<div class="input-group">-->
                            <!--<span class="input-group-text"><i class="fa fa-lock fa-lg" aria-hidden="true"></i></span>-->
                            <!--<input type="secret" class="form-control" name="confirm" roleId="confirm"  placeholder="Confirm your Secret" required="required"/>-->
                        <!--</div>-->
                    <!--</div>-->
                <!--</div>-->

                <div class="mb-3">
                    <button type="submit" class="btn btn-primary btn-lg w-100 login-button">Sign up!</button>
                </div>
                
                <hr />
                
				<div class="mb-3">
                    <a  class="btn btn-info btn-lg w-100 login-button" th:href="@{/}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    </fieldset>
</div>


<div th:replace="common/header :: body-bottom-scripts" />

</body>
</html>
