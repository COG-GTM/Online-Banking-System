# ===============================
# = DEVELOPMENT PROFILE
# ===============================

# Local development only: let Hibernate build/update the schema from the java
# entities and echo the generated SQL. Never enable this outside development.
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
