# ===============================
# = LOCAL DEVELOPMENT PROFILE
# ===============================
# Activate with -Dspring.profiles.active=dev. Never enable in production:
# it serves the application over plain HTTP and lets Hibernate own the schema.

# Plain HTTP locally, so the session cookie must not be Secure
server.servlet.session.cookie.secure = false
app.security.require-ssl = false

# Create/update the local schema from the entities instead of requiring
# migrations, and echo the generated SQL
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
