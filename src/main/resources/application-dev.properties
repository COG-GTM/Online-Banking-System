# ===============================
# = DEVELOPMENT PROFILE
# ===============================
# Activated with -Dspring-boot.run.profiles=dev (or SPRING_PROFILES_ACTIVE=dev).
# Only for local development: it lets Hibernate create/update the schema from
# the entities and echoes every SQL statement to the log.

spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = update
