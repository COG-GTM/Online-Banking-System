# ===============================
# = SPRING
# ===============================

# UserServiceImpl and AccountServiceImpl reference each other.
spring.main.allow-circular-references = true

# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

# Connection url for the database "netgloo_blog"
spring.datasource.url = jdbc:mysql://localhost:3306/OnlineBankingSystem

# Username and secret
spring.datasource.username = root
spring.datasource.password = 

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query
spring.jpa.show-sql = true

# Hibernate ddl auto (create, create-drop, update): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto = update

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# Keep Hibernate 5's shared `hibernate_sequence` for GenerationType.AUTO ids so
# existing databases continue from their current next_val instead of new
# per-entity `<entity>_seq` tables starting at 1.
spring.jpa.properties.hibernate.id.db_structure_naming_strategy = legacy
