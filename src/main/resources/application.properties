# ===============================
# = DATA SOURCE
# ===============================

# Credentials are supplied through the environment, never committed.
spring.datasource.url = ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

spring.jpa.show-sql = false

# The schema is managed outside of the application; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto = ${SPRING_JPA_DDL_AUTO:validate}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# ===============================
# = SESSION / TRANSPORT SECURITY
# ===============================

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = ${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site = lax

# Honour X-Forwarded-* headers so redirects stay on https behind a proxy.
server.forward-headers-strategy = native

# ===============================
# = CORS
# ===============================

# Comma separated list of allowed origins; empty disables CORS entirely.
app.cors.allowed-origins = ${APP_CORS_ALLOWED_ORIGINS:}
