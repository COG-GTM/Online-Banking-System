# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem}

# Credentials are supplied through the environment, never committed
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

spring.jpa.show-sql = ${JPA_SHOW_SQL:false}

# Schema changes are applied through migrations; the application only validates
spring.jpa.hibernate.ddl-auto = ${JPA_DDL_AUTO:validate}

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect

# ===============================
# = SECURITY
# ===============================

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = ${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site = lax

# Redirect all traffic to HTTPS when the application is served over TLS
app.security.require-https = ${REQUIRE_HTTPS:false}

# Failed login throttling
app.security.login.max-attempts = 5
app.security.login.block-duration-ms = 900000

# Comma separated list of browser origins allowed to call the API (empty = none)
app.cors.allowed-origins = ${CORS_ALLOWED_ORIGINS:}
