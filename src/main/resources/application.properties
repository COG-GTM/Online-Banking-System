# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

# Connection url for the database "netgloo_blog"
spring.datasource.url = jdbc:mysql://localhost:3306/OnlineBankingSystem

# Username and secret
spring.datasource.username = root
spring.datasource.password = 

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query
spring.jpa.show-sql = true

# Hibernate ddl auto (create, create-drop, update): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto = update

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect

# ===============================
# = TRANSPORT SECURITY
# ===============================

# All traffic must be HTTPS. Set app.security.require-ssl = false only for
# local development over plain HTTP.
app.security.require-ssl = true

# Honour X-Forwarded-Proto/X-Forwarded-For when TLS is terminated at a proxy so
# that redirects, requiresChannel and secure cookies see the external scheme.
server.use-forward-headers = true

# Session and remember-me cookies are only sent over HTTPS and are not
# readable from JavaScript.
server.servlet.session.cookie.secure = true
server.servlet.session.cookie.http-only = true

