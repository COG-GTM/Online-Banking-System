# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

# Connection url for the database "netgloo_blog"
spring.datasource.url = jdbc:mysql://localhost:3306/OnlineBankingSystem

# Username and secret
spring.datasource.username = root
spring.datasource.password = 

# Connection pool is HikariCP (Boot 2 default); it validates connections with
# JDBC4 isValid(), so the old Tomcat-pool testWhileIdle/validationQuery keys are gone.

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query
spring.jpa.show-sql = true

# Hibernate ddl auto (create, create-drop, update): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto = update

# Views read lazy associations (e.g. user.primaryAccount), so keep the session open while rendering
spring.jpa.open-in-view = true

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect