# ===============================
# = DATA SOURCE
# ===============================

# Credentials are supplied through the environment; no defaults are committed.
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem?useSSL=true&requireSSL=false}
spring.datasource.username = ${DB_USERNAME:}
spring.datasource.password = ${DB_PASSWORD:}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

spring.jpa.show-sql = ${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto = ${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect

# ===============================
# = SECURITY
# ===============================

# Comma separated list of origins allowed for cross origin requests (empty disables CORS)
app.cors.allowed-origins = ${CORS_ALLOWED_ORIGINS:}

# Require HTTPS and emit HSTS headers (enable in any deployed environment)
app.security.require-ssl = ${REQUIRE_SSL:false}

app.security.login.max-attempts = 5
app.security.login.lock-seconds = 900

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = ${REQUIRE_SSL:false}
