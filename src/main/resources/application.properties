# ===============================
# = DATA SOURCE
# ===============================
# All credentials are supplied through the environment; no secrets are committed.

spring.datasource.url = ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD:}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# SQL statements can contain account data, so they are never echoed by default.
spring.jpa.show-sql = ${SPRING_JPA_SHOW_SQL:false}

# The schema is managed outside of the application; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto = ${SPRING_JPA_DDL_AUTO:validate}

# ===============================
# = SECURITY
# ===============================

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = ${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site = lax

# HTTPS is required by default; set to false only for local HTTP development.
app.security.require-https = ${APP_SECURITY_REQUIRE_HTTPS:true}

# Comma separated list of browser origins allowed to call the API. Empty disables CORS.
app.cors.allowed-origins = ${APP_CORS_ALLOWED_ORIGINS:}
