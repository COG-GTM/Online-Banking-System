# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection.
# Credentials are supplied via environment variables; never commit them.
# Use a least-privilege application user, not the database root account.

# Connection url for the database
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem}

# Username and secret
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query
spring.jpa.show-sql = false

# Hibernate ddl auto (none, validate, update, create, create-drop): "validate"
# only checks the schema against the entities and never modifies it.
# Development overrides live in application-dev.properties.
spring.jpa.hibernate.ddl-auto = validate

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect
