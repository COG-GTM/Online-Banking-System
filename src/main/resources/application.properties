# ===============================
# = DATA SOURCE
# ===============================

# Credentials are supplied through the environment, never committed.
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem?useSSL=true&requireSSL=false}
spring.datasource.username = ${DB_USERNAME:}
spring.datasource.password = ${DB_PASSWORD:}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto = ${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

# ===============================
# = SESSION / COOKIES
# ===============================

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = ${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site = lax
