# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

# Connection url for the database, overridable per environment
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem}

# Credentials come from the environment (or a secrets manager); the application
# must run as a least-privilege database user, never as the server superuser.
# Startup fails when DB_USERNAME / DB_PASSWORD are not provided.
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query
spring.jpa.show-sql = false

# Hibernate ddl auto: the schema is owned by migrations, the application only
# checks that it matches the entities
spring.jpa.hibernate.ddl-auto = validate

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect

# ===============================
# = TRANSPORT SECURITY
# ===============================

# Session cookie hardening
server.servlet.session.cookie.secure = true
server.servlet.session.cookie.http-only = true

# Reject plain HTTP requests (see the "dev" profile for local HTTP runs)
app.security.require-ssl = true

# Honour X-Forwarded-* from the TLS-terminating proxy so redirects and
# request.isSecure() reflect the client-facing HTTPS connection
server.use-forward-headers = true

# TLS in the application itself, for deployments that do not terminate at a
# proxy: set SSL_ENABLED=true and point the properties below at the keystore
server.ssl.enabled = ${SSL_ENABLED:false}
server.ssl.key-store = ${SSL_KEY_STORE:}
server.ssl.key-store-password = ${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type = ${SSL_KEY_STORE_TYPE:PKCS12}