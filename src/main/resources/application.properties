# ===============================
# = DATA SOURCE
# ===============================

spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem}

# Credentials are supplied by the environment, never committed.
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

spring.jpa.show-sql = false

# The schema is managed by migrations/DBA scripts, not by Hibernate.
spring.jpa.hibernate.ddl-auto = ${JPA_DDL_AUTO:validate}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# ===============================
# = SESSION / TRANSPORT SECURITY
# ===============================

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = true
server.servlet.session.cookie.same-site = lax
server.servlet.session.timeout = 15m

# Honour X-Forwarded-* headers so redirects and secure cookies work behind a TLS proxy.
server.forward-headers-strategy = native

# ===============================
# = ERROR HANDLING
# ===============================

server.error.include-stacktrace = never
server.error.include-message = never
