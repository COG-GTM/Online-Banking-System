# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

# Connection url for the database "netgloo_blog"
spring.datasource.url = jdbc:mysql://localhost:3306/OnlineBankingSystem

# Username and secret
spring.datasource.username = root
spring.datasource.password = 

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query. Statement logging is off by default so
# query text and bound values never reach the application log outside of local
# debugging; override with SPRING_JPA_SHOW_SQL=true when needed.
spring.jpa.show-sql = ${SPRING_JPA_SHOW_SQL:false}

# Hibernate ddl auto (none, validate, update, create, create-drop). The schema
# is managed outside the application, so it is only validated against the
# entities at startup. Override with SPRING_JPA_DDL_AUTO (e.g.
# "update") when bootstrapping a throwaway local database.
spring.jpa.hibernate.ddl-auto = ${SPRING_JPA_DDL_AUTO:validate}

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect