# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

# Connection url for the database "netgloo_blog"
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem}

# Credentials are supplied through the environment; no defaults are committed
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.hikari.connection-test-query = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query
spring.jpa.show-sql = false

# Hibernate ddl auto (create, create-drop, update): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto = ${JPA_DDL_AUTO:validate}

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

# ===============================
# = SESSION / TRANSPORT SECURITY
# ===============================

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = ${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site = strict
server.servlet.session.timeout = 15m
server.forward-headers-strategy = framework