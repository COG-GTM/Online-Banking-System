# ===============================
# = DATA SOURCE
# ===============================

# Credentials are supplied through the environment, never committed.
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem?useSSL=true&requireSSL=false&serverTimezone=UTC}
spring.datasource.username = ${DB_USERNAME:}
spring.datasource.password = ${DB_PASSWORD:}

spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.open-in-view = false

# ===============================
# = SECURITY
# ===============================

app.security.require-https = ${REQUIRE_HTTPS:false}
app.security.login.max-attempts = 5
app.security.login.lockout-minutes = 15
app.cors.allowed-origins = ${CORS_ALLOWED_ORIGINS:}

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = ${SECURE_COOKIES:false}
server.servlet.session.cookie.same-site = lax
server.error.include-message = never
server.error.include-stacktrace = never
