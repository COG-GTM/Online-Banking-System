# ===============================
# = DATA SOURCE
# ===============================

# Credentials are supplied through the environment, never committed.
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem?useSSL=true&requireSSL=false}
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

spring.jpa.show-sql = false

# Schema changes are applied through migrations, not by Hibernate.
spring.jpa.hibernate.ddl-auto = ${DDL_AUTO:validate}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

# ===============================
# = SESSION / TRANSPORT SECURITY
# ===============================

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = ${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site = lax

# Set to true when the application is served over HTTPS (or behind a TLS terminating proxy
# with forwarded headers enabled) to redirect plain HTTP requests.
app.security.require-https = ${REQUIRE_HTTPS:false}

# Comma separated list of browser origins allowed to call the API. Empty disables CORS.
app.cors.allowed-origins = ${CORS_ALLOWED_ORIGINS:}

# Brute force protection for the login form.
app.security.login.max-attempts = 5
app.security.login.lock-minutes = 15
