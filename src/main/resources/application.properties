# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

# Connection settings are supplied through the environment so that credentials
# are never committed to source control.
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem}
spring.datasource.username = ${DB_USERNAME:}
spring.datasource.password = ${DB_PASSWORD:}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query
spring.jpa.show-sql = ${JPA_SHOW_SQL:false}

# Hibernate ddl auto (create, create-drop, update): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto = ${JPA_DDL_AUTO:validate}

# ===============================
# = TRANSPORT SECURITY / SESSION
# ===============================

# Session cookies are marked secure by default; set SESSION_COOKIE_SECURE=false
# only for plain HTTP local development.
server.servlet.session.cookie.secure = ${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.same-site = lax
server.forward-headers-strategy = framework

# Redirect plain HTTP requests to HTTPS when the application is exposed directly.
app.security.require-https = ${REQUIRE_HTTPS:false}

# Comma separated list of browser origins allowed to call the API. Empty
# disables CORS entirely.
app.security.allowed-origins = ${CORS_ALLOWED_ORIGINS:}

# Brute force protection for form login.
app.security.login.max-attempts = ${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-duration-seconds = ${LOGIN_LOCK_SECONDS:900}