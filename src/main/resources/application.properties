# ===============================
# = DATA SOURCE
# ===============================

# Credentials are supplied through the environment, never committed.
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem}
spring.datasource.username = ${DB_USERNAME:}
spring.datasource.password = ${DB_PASSWORD:}

spring.datasource.hikari.connection-test-query = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

spring.jpa.show-sql = false
spring.jpa.open-in-view = false

# Schema changes are applied by migrations, not by Hibernate.
spring.jpa.hibernate.ddl-auto = validate

# ===============================
# = SECURITY
# ===============================

server.servlet.session.cookie.secure = ${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.same-site = lax

app.security.require-https = ${REQUIRE_HTTPS:true}
app.security.login.max-attempts = 5
app.security.login.lockout-minutes = 15

# Comma separated list of browser origins allowed to call the API; empty disables CORS.
app.cors.allowed-origins = ${CORS_ALLOWED_ORIGINS:}

# ===============================
# = ERROR HANDLING
# ===============================

server.error.include-message = never
server.error.include-stacktrace = never
