spring.datasource.url = ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/OnlineBankingSystem?useSSL=true&requireSSL=false}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto = ${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view = false

server.servlet.session.cookie.http-only = true
server.servlet.session.cookie.secure = ${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site = lax

server.error.include-message = never
server.error.include-stacktrace = never
