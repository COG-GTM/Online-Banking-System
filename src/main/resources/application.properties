# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

# Connection url for the database "netgloo_blog"
spring.datasource.url = jdbc:mysql://localhost:3306/OnlineBankingSystem

# Username and secret
spring.datasource.username = root
spring.datasource.password = 

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = TRANSPORT SECURITY
# ===============================

# Every request has to be served over HTTPS. Set REQUIRE_SSL=false only when
# running locally without TLS.
security.require-ssl = ${REQUIRE_SSL:true}

# TLS is either terminated by this application (SSL_ENABLED=true together with
# the server.ssl.key-store* settings below) or by a front proxy.
server.ssl.enabled = ${SSL_ENABLED:false}
# server.ssl.key-store = classpath:keystore.p12
# server.ssl.key-store-type = PKCS12
# server.ssl.key-store-password = <keystore password>
# server.ssl.key-alias = <key alias>
# Enable only when a trusted reverse proxy terminates TLS and sets
# X-Forwarded-Proto; otherwise any client can spoof that header and make a
# cleartext request look secure.
server.use-forward-headers = ${BEHIND_TLS_PROXY:false}

# ===============================
# = SESSION COOKIE
# ===============================

server.session.cookie.secure = ${REQUIRE_SSL:true}
server.session.cookie.http-only = true

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query
spring.jpa.show-sql = true

# Hibernate ddl auto (create, create-drop, update): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto = update

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect